<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>圆与切线 · GeoGebra</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffcf0;
      --surface: #f2f0e5;
      --ink: #100f0f;
      --muted: #6f6e69;
      --line: #e6e4d9;
      --accent: #bc5215;
      --accent-soft: #fce8d5;
      --green: #66800b;
      --blue: #24837b;
      --shadow: 0 14px 40px rgb(16 15 15 / 5%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }
    main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--accent); background: var(--surface); font-size: 17px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    select, button { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); font: inherit; }
    select { min-width: 122px; padding: 0 30px 0 12px; }
    button { padding: 0 14px; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
    button:hover:not(:disabled) { border-color: #c9c6b8; background: var(--surface); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.primary { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    button.primary:hover:not(:disabled) { border-color: #343331; background: #343331; }
    button:disabled, select:disabled { cursor: wait; opacity: .55; }
    .stage { position: relative; overflow: hidden; min-height: 480px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--shadow); }
    #ggb-element { width: 100%; height: min(72vh, 690px); min-height: 480px; }
    #status { position: absolute; z-index: 2; top: 14px; left: 16px; margin: 0; color: var(--muted); font-size: 12px; pointer-events: none; }
    .below { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 14px 2px 0; color: var(--muted); font-size: 13px; }
    .statement { max-width: 740px; }
    .statement strong { color: var(--ink); font-weight: 550; }
    .hint { white-space: nowrap; }
    .fit { width: 38px; padding: 0; font-size: 16px; }
    @media (max-width: 640px) {
      main { width: min(100% - 24px, 1120px); padding-top: 16px; }
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
      .toolbar { width: 100%; }
      select { flex: 1; }
      .stage, #ggb-element { min-height: 390px; }
      #ggb-element { height: 62vh; }
      .below { flex-direction: column; gap: 4px; }
      .hint { white-space: normal; }
    }
    @media print {
      body { background: white; }
      main { width: 100%; padding: 0; }
      header, .below { display: none; }
      .stage { border: 0; box-shadow: none; border-radius: 0; }
      #ggb-element { height: 100vh; }
      #status { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title"><span class="mark" aria-hidden="true">◌</span><h1>圆与切线</h1></div>
      <div class="toolbar" aria-label="图形操作">
        <button class="fit" id="fit" type="button" title="适合视图" aria-label="适合视图" disabled>⤢</button>
        <select id="format" aria-label="导出格式" disabled>
          <option value="ggb">GeoGebra 文件</option>
          <option value="png">PNG 图片</option>
          <option value="svg">SVG 矢量图</option>
          <option value="pdf">PDF 文档</option>
          <option value="xml">XML 源文件</option>
          <option value="html">交互 HTML</option>
        </select>
        <button class="primary" id="export" type="button" disabled>下载</button>
      </div>
    </header>
    <section class="stage" aria-label="可交互几何图形">
      <p id="status" role="status" aria-live="polite">正在加载图形…</p>
      <div id="ggb-element"></div>
    </section>
    <div class="below">
      <div class="statement"><strong>已知</strong> Γ：x² + y² = 25，ω：(x − 3)² + y² = 64/25。拖动 A，观察切线与弦 BC 的变化。</div>
      <div class="hint">图中 DB = DC = DI；BC 与 ω 相切。</div>
    </div>
  </main>
  <script>
    const specification = {
      commands: [
        "Gamma: x^2 + y^2 = 25",
        "omega: (x - 3)^2 + y^2 = 64 / 25",
        "O = (0, 0)",
        "I = (3, 0)",
        "A = Point(Gamma)",
        "dx = x(A) - x(I)",
        "dy = y(A) - y(I)",
        "q = dx^2 + dy^2",
        "T_1 = (x(I) + (64 / 25 * dx - 8 / 5 * sqrt(q - 64 / 25) * dy) / q, y(I) + (64 / 25 * dy + 8 / 5 * sqrt(q - 64 / 25) * dx) / q)",
        "T_2 = (x(I) + (64 / 25 * dx + 8 / 5 * sqrt(q - 64 / 25) * dy) / q, y(I) + (64 / 25 * dy - 8 / 5 * sqrt(q - 64 / 25) * dx) / q)",
        "t_1 = Line(A, T_1)",
        "t_2 = Line(A, T_2)",
        "B = OtherIntersection(Gamma, t_1, A)",
        "C = OtherIntersection(Gamma, t_2, A)",
        "D = OtherIntersection(Gamma, Line(A, I), A)",
        "AB = Segment(A, B)",
        "AC = Segment(A, C)",
        "BC = Segment(B, C)",
        "DB = Segment(D, B)",
        "DC = Segment(D, C)",
        "DI = Segment(D, I)"
      ],
      viewport: { xMin: -6.5, xMax: 6.5, yMin: -6.5, yMax: 6.5 }
    };
    const status = document.getElementById('status');
    const $ = (selector) => document.querySelector(selector);
    let api;
    window.ggbReady = false;
    window.ggbError = null;

    function download(data, mime, extension, base64 = false) {
      const payload = base64
        ? Uint8Array.from(atob(data.replace(/^data:[^,]+,/, '')), c => c.charCodeAt(0))
        : data;
      const url = URL.createObjectURL(new Blob([payload], { type: mime }));
      const link = document.createElement('a');
      link.href = url;
      link.download = '圆与切线.' + extension;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function callbackExport(format) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('导出超时，请重试。')), 20000);
        const done = value => {
          clearTimeout(timer);
          value ? resolve(value) : reject(new Error('GeoGebra 未返回导出数据。'));
        };
        try {
          if (format === 'ggb') api.getBase64(done);
          else if (format === 'pdf') api.exportPDF(1, done);
          else api.exportSVG(done);
        } catch (error) { clearTimeout(timer); reject(error); }
      });
    }

    async function fitView() {
      const names = api.getAllObjectNames();
      if (!names.length) return;
      api.showAllObjects();
      await new Promise(resolve => setTimeout(resolve, 350));
      const view = JSON.parse(api.getViewProperties(1));
      const scale = Math.max(13 / view.width, 13 / view.height);
      const cx = view.xMin + view.width * view.invXscale / 2;
      const cy = view.yMin + view.height * view.invYscale / 2;
      api.setCoordSystem(cx - view.width * scale / 2, cx + view.width * scale / 2,
        cy - view.height * scale / 2, cy + view.height * scale / 2);
    }

    function styleConstruction() {
      const visible = new Set(['O', 'I', 'A', 'B', 'C', 'D', 'Gamma', 'omega']);
      const labels = { Gamma: '$\\Gamma$', omega: '$\\omega$' };
      for (const name of api.getAllObjectNames()) {
        const type = api.getObjectType(name);
        api.setLabelVisible(name, visible.has(name));
        api.setCaption(name, labels[name] || '$' + name + '$');
        api.setLabelStyle(name, 3);
        if (name === 'Gamma') { api.setColor(name, 175, 169, 151); api.setLineThickness(name, 2); }
        else if (name === 'omega') { api.setColor(name, 188, 82, 21); api.setLineThickness(name, 3); }
        else if (name === 'BC') { api.setColor(name, 102, 128, 11); api.setLineThickness(name, 5); }
        else if (name === 'DB' || name === 'DC' || name === 'DI') { api.setColor(name, 36, 131, 123); api.setLineThickness(name, 4); }
        else if (name === 'AB' || name === 'AC') { api.setColor(name, 188, 82, 21); api.setLineThickness(name, 3); }
        else if (name === 'A' || name === 'B' || name === 'C' || name === 'D' || name === 'I' || name === 'O') {
          api.setColor(name, name === 'A' ? 188 : 16, name === 'A' ? 82 : 15, name === 'A' ? 21 : 15);
          api.setPointSize(name, name === 'A' ? 6 : 4);
          api.setPointStyle(name, 0);
        } else if (type === 'point') api.setPointSize(name, 3);
        else if (type === 'line' || type === 'segment') api.setColor(name, 111, 110, 105);
      }
      api.setLabelVisible('T_1', false);
      api.setLabelVisible('T_2', false);
    }

    $('#fit').addEventListener('click', async () => {
      try { await fitView(); status.textContent = '视图已调整。'; }
      catch (error) { status.textContent = error.message; }
    });

    $('#export').addEventListener('click', async () => {
      if (!window.ggbReady) return;
      const format = $('#format').value;
      try {
        if (format === 'xml') download(api.getXML(), 'application/xml', 'xml');
        else if (format === 'png') download(api.getPNGBase64(2, false, 144), 'image/png', 'png', true);
        else if (format === 'html') {
          const base64 = await callbackExport('ggb');
          const html = window.constructionTemplate.replace(
            /const specification = \{[\s\S]*?\n    \};\n    const status/,
            'const specification = ' + JSON.stringify({ commands: [], ggbBase64: base64 }).replace(/</g, '\\u003c') + ';\n    const status'
          );
          download(html, 'text/html', 'html');
        } else {
          const value = await callbackExport(format);
          download(value, format === 'pdf' ? 'application/pdf' : 'image/svg+xml', format, format === 'pdf');
        }
        status.textContent = '文件已生成。';
      } catch (error) { status.textContent = error.message || '导出失败。'; }
    });

    window.startGeoGebra = () => {
      window.constructionTemplate = '<!doctype html>\n' + document.documentElement.outerHTML;
      const applet = new GGBApplet({
        appName: 'classic',
        width: document.getElementById('ggb-element').clientWidth,
        height: document.getElementById('ggb-element').clientHeight,
        ...(specification.ggbBase64 ? { ggbBase64: specification.ggbBase64 } : {}),
        language: 'zh-CN',
        showToolBar: false, showMenuBar: false, showAlgebraInput: false,
        showResetIcon: false, useBrowserForJS: false, preventFocus: true,
        enableLabelDrags: true, enableShiftDragZoom: true,
        appletOnLoad: async loaded => {
          api = loaded;
          window.ggbApplet = api;
          try {
            new ResizeObserver(() => api.setSize(
              document.getElementById('ggb-element').clientWidth,
              document.getElementById('ggb-element').clientHeight
            )).observe(document.getElementById('ggb-element'));
            api.setErrorDialogsActive(false);
            api.setPerspective('G');
            api.setAxesVisible(false, false);
            api.setGridVisible(false);
            for (const command of specification.commands) {
              if (!api.evalCommand(command)) throw new Error('图形构造失败：' + command);
            }
            styleConstruction();
            await fitView();
            api.setAxesVisible(false, false);
            window.ggbReady = true;
            status.textContent = '就绪 · 拖动点 A';
            $('#fit').disabled = false;
            $('#format').disabled = false;
            $('#export').disabled = false;
          } catch (error) {
            window.ggbError = error.message;
            status.textContent = error.message;
          }
        }
      }, true);
      applet.inject('ggb-element');
    };

    setTimeout(() => {
      if (!window.ggbReady && !window.ggbError) status.textContent = '仍在加载 GeoGebra，请检查网络后刷新。';
    }, 30000);
  </script>
  <script src="https://www.geogebra.org/apps/deployggb.js" onload="startGeoGebra()" onerror="window.ggbError='GeoGebra 加载失败';document.getElementById('status').textContent=window.ggbError"></script>
</body>
</html>
