<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>GeoGebra</title>
<style>
:root{color-scheme:light;--paper:#fffcf0;--line:#e6e4d9;--ink:#100f0f;--muted:#6f6e69;--hover:#f2f0e5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
main{width:min(1280px,calc(100% - 32px));margin:0 auto;padding:12px 0 16px}
header{position:relative;z-index:10;display:flex;justify-content:flex-end;min-height:42px;margin-bottom:8px}
.downloads{position:relative}.download-toggle{height:38px;min-width:72px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.download-toggle:hover,.download-toggle[aria-expanded="true"]{background:var(--hover);border-color:#c9c6b8}
.download-menu{position:absolute;top:43px;right:0;z-index:20;display:none;min-width:170px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 12px 32px rgb(16 15 15 / 12%)}
.download-menu.open{display:grid}.download-menu button{height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.download-menu button:hover{background:var(--hover)}.download-menu button:disabled{opacity:.5;cursor:wait}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
#ggb-element{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}#ggb-element iframe,#ggb-element>div{display:block;width:100%!important;height:100%!important;border:0}
#status{position:absolute;inset:0;z-index:2;display:grid;place-items:center;margin:0;padding:16px;color:var(--muted);background:var(--paper);text-align:center;pointer-events:none}
#status[hidden]{display:none}#status.error{color:#af3029}
@media(max-width:640px){main{width:calc(100% - 16px);padding-top:8px}.stage{border-radius:7px}header{margin-bottom:6px}}
@media print{main{width:100%;padding:0}header{display:none}.stage{border:0;border-radius:0}}
</style></head><body><main>
<header><div class="downloads"><button class="download-toggle" id="download-toggle" type="button" aria-expanded="false" aria-haspopup="menu">下载</button>
<div class="download-menu" id="download-menu" role="menu" aria-label="下载格式">
<button type="button" role="menuitem" data-format="ggb">GeoGebra 文件</button>
<button type="button" role="menuitem" data-format="png">PNG 图片</button>
<button type="button" role="menuitem" data-format="svg">SVG 矢量图</button>
<button type="button" role="menuitem" data-format="pdf">PDF 文档</button>
<button type="button" role="menuitem" data-format="xml">XML 源文件</button>
<button type="button" role="menuitem" data-format="html">交互 HTML</button></div></div></header>
<section class="stage" aria-label="GeoGebra 图形"><p id="status" role="status" aria-live="polite">正在加载…</p><div id="ggb-element"></div></section></main>
<script id="construction-data" type="application/json">{"commands":["g: x^2 + y^2 = 25","w: (x - 3)^2 + y^2 = 64 / 25","O = (0, 0)","I = (3, 0)","A = Point(g)","SetCoords(A, 5, 0)","p = Polar(A, w)","T_1 = Intersect(p, w, 1)","T_2 = Intersect(p, w, 2)","t_1 = Line(A, T_1)","t_2 = Line(A, T_2)","E_B = Intersect(g, t_1, 1)","F_B = Intersect(g, t_1, 2)","B = If(Distance(E_B, A) > 0.001, E_B, F_B)","E_C = Intersect(g, t_2, 1)","F_C = Intersect(g, t_2, 2)","C = If(Distance(E_C, A) > 0.001, E_C, F_C)","l_AI = Line(A, I)","E_D = Intersect(g, l_AI, 1)","F_D = Intersect(g, l_AI, 2)","D = If(Distance(E_D, A) > 0.001, E_D, F_D)","l_AB = Line(A, B)","l_AC = Line(A, C)","l_BC = Line(B, C)","s_DB = Segment(D, B)","s_DC = Segment(D, C)","s_DI = Segment(D, I)"],"visibleLabels":["O","I","A","B","C","D","g","w"],"captionOverrides":{"g":"$\\Gamma$","w":"$\\omega$"}}</script>
<script>
const specification=JSON.parse(document.getElementById('construction-data').textContent);
const host=document.getElementById('ggb-element'),status=document.getElementById('status');
const toggle=document.getElementById('download-toggle'),menu=document.getElementById('download-menu');
let api,ready=false,resizeObserver;
window.ggbReady=false;window.ggbError=null;
function setStatus(text,error=false){status.textContent=text;status.classList.toggle('error',error);status.hidden=!text;}
function setSize(){if(api)api.setSize(Math.round(host.clientWidth),Math.round(host.clientHeight));}
function toBytes(data){return Uint8Array.from(atob(data.replace(/^data:[^,]+,/,'')),c=>c.charCodeAt(0));}
function download(data,mime,extension,base64=false){const blob=new Blob([base64?toBytes(data):data],{type:mime});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='construction.'+extension;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function callbackExport(format){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('导出超时')),20000);const done=value=>{clearTimeout(timer);value?resolve(value):reject(new Error('GeoGebra 未返回文件'))};try{if(format==='ggb')api.getBase64(done);else if(format==='pdf')api.exportPDF(1,done);else api.exportSVG(done)}catch(error){clearTimeout(timer);reject(error)}})}
function fitView(){api.showAllObjects();const view=JSON.parse(api.getViewProperties(1));const sx=Math.max(view.width*view.invXscale*1.2,2),sy=Math.max(view.height*view.invYscale*1.2,2),scale=Math.max(sx/view.width,sy/view.height),cx=view.xMin+view.width*view.invXscale/2,cy=view.yMin+view.height*view.invYscale/2;api.setCoordSystem(cx-view.width*scale/2,cx+view.width*scale/2,cy-view.height*scale/2,cy+view.height*scale/2)}
function applyMcpDefaults(){const names=api.getAllObjectNames();const visible=new Set(specification.visibleLabels||[]);for(const name of names){try{api.setCaption(name,(specification.captionOverrides||{})[name]||'$'+name+'$');api.setLabelStyle(name,3);api.setLabelVisible(name,visible.size?visible.has(name):api.getObjectType(name)==='point');if(api.getObjectType(name)==='point')api.setPointSize(name,2);else if(['line','segment','ray','vector','circle','conic','polygon','function','curve'].includes(api.getObjectType(name)))api.setLineThickness(name,2)}catch(_){}}}
async function exportAs(format){if(!ready)return;try{if(format==='xml'){download(api.getXML(),'application/xml','xml')}else if(format==='png'){download(api.getPNGBase64(2,false,144),'image/png','png',true)}else if(format==='html'){const base64=await callbackExport('ggb');const html=window.constructionTemplate.replace(/(<script id="construction-data" type="application/json">)[\s\S]*?(<\/script>)/,'$1'+JSON.stringify({commands:[],ggbBase64:base64,visibleLabels:specification.visibleLabels||[],captionOverrides:specification.captionOverrides||{}})+'$2');download(html,'text/html','html')}else{const value=await callbackExport(format);download(value,format==='pdf'?'application/pdf':'image/svg+xml',format,format==='pdf')}setStatus('')}catch(error){setStatus(error.message||'导出失败',true)}}
toggle.addEventListener('click',()=>{const open=menu.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open))});
menu.addEventListener('click',async event=>{const button=event.target.closest('[data-format]');if(!button)return;menu.classList.remove('open');toggle.setAttribute('aria-expanded','false');await exportAs(button.dataset.format)});
document.addEventListener('click',event=>{if(!event.target.closest('.downloads')){menu.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
window.startGeoGebra=()=>{window.constructionTemplate='<!doctype html>\n'+document.documentElement.outerHTML;const width=Math.max(200,Math.round(host.clientWidth)),height=Math.round(width*9/16);const applet=new GGBApplet({appName:'classic',width,height,language:'zh-CN',showToolBar:false,showMenuBar:false,showAlgebraInput:false,showResetIcon:false,useBrowserForJS:false,preventFocus:true,enableLabelDrags:true,enableShiftDragZoom:true,...(specification.ggbBase64?{ggbBase64:specification.ggbBase64}:{}),appletOnLoad:async loaded=>{api=loaded;window.ggbApplet=api;try{api.setErrorDialogsActive(false);if(!specification.ggbBase64){api.setPerspective('G');api.setAxesVisible(false,false);api.setGridVisible(false);for(const command of specification.commands||[]){if(!api.evalCommand(command))throw new Error('GeoGebra 无法识别命令：'+command)}applyMcpDefaults();if((specification.commands||[]).length)fitView()}api.setAxesVisible(false,false);ready=true;window.ggbReady=true;status.hidden=true;resizeObserver=new ResizeObserver(setSize);resizeObserver.observe(document.querySelector('.stage'));setSize()}catch(error){window.ggbError=error.message;setStatus(error.message,true)}}},true);applet.inject('ggb-element')};
setTimeout(()=>{if(!ready&&!window.ggbError)setStatus('GeoGebra 加载超时，请检查网络后刷新',true)},30000);
</script><script src="https://www.geogebra.org/apps/deployggb.js" onload="startGeoGebra()" onerror="window.ggbError='GeoGebra 加载失败';document.getElementById('status').className='error';document.getElementById('status').textContent=window.ggbError"></script>
</body></html>
