name: Verify GeoGebra Studio and publish to npm
on:
  workflow_dispatch:
    inputs:
      native:
        description: Run optional Chrome and LaTeX checks
        type: boolean
        default: false
      publish:
        description: Publish the npm package for an existing release_tag after acceptance (requires npm OIDC trusted publisher)
        type: boolean
        default: false
      release_tag:
        description: Existing GitHub release tag (for example v0.5.0)
        type: string
        required: false
  release:
    types: [published]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GEOGEBRA_STUDIO_HOME: /tmp/geogebra-studio
      CODEX_HOME: /tmp/codex-geogebra-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          STUDIO_RELEASE_NAME: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node -e 'if (require("./package.json").version !== process.env.STUDIO_RELEASE_NAME.replace(/^v/, "")) process.exit(1)'
      - run: npm run build
      - run: npm run test:unit
      - run: npm run verify:manifests
      - run: node scripts/verify-generator.cjs
      - run: node scripts/verify-skill.cjs
      - run: node scripts/verify-exports.cjs
      - if: github.event_name == 'workflow_dispatch' && inputs.native
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra
      - if: github.event_name == 'workflow_dispatch' && inputs.native
        run: node scripts/verify-gikz-latex.cjs
      - name: Prepare optional Chrome runtime
        if: github.event_name == 'workflow_dispatch' && inputs.native
        run: |
          node dist/cli.js browser install > browser.json
          echo "PUPPETEER_EXECUTABLE_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("browser.json","utf8")).executablePath')" >> "$GITHUB_ENV"
      - if: github.event_name == 'workflow_dispatch' && inputs.native
        run: node scripts/verify-artifact.cjs
      - if: github.event_name == 'workflow_dispatch' && inputs.native
        run: STUDIO_HTML_FIXTURE=output/verification/studio/tangent-construction.html node scripts/verify-viewer.cjs
      - run: node scripts/package-release.cjs
      - run: npm_config_cache=${{ runner.temp }}/npm-cache node scripts/verify-package.cjs
      - run: npm install --global @openai/codex@0.162.1
      - run: node dist/cli.js install --local
      - run: node scripts/verify-plugin-session.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: geogebra-studio-acceptance-${{ github.event.release.tag_name || inputs.release_tag || 'manual' }}
          path: |
            release/*.tgz
            release/*.zip
            release/package-report.json
            output/verification/studio/*
            output/verification/viewer/*
            output/verification/gikz-compile/*
            output/verification/plugin-session.json
  publish:
    needs: acceptance
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag != '')
    runs-on: ubuntu-latest
    environment: npm
    env:
      GEOGEBRA_STUDIO_HOME: /tmp/geogebra-studio-public
      CODEX_HOME: /tmp/codex-geogebra-public
      STUDIO_RELEASE_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: geogebra-studio-acceptance-${{ github.event.release.tag_name || inputs.release_tag }}
          path: .
      - name: Publish the exact accepted tarball
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: node -e 'const r=require("./release/package-report.json");require("node:child_process").execFileSync("npm",["publish","./release/"+r.npm,"--ignore-scripts","--access","public","--provenance","--tag",process.env.STUDIO_RELEASE_TAG],{stdio:"inherit"})'
      - name: Wait for public Registry availability and verify integrity
        run: node scripts/verify-registry.cjs
      - run: npm install --global @openai/codex@0.162.1
      - name: Install the public npm plugin
        env:
          npm_config_ignore_scripts: 'true'
          STUDIO_EXPECTED_VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        working-directory: ${{ runner.temp }}
        run: npx --yes --package=@lydt/geogebra-studio@${STUDIO_EXPECTED_VERSION#v} -- geogebra-studio install
      - name: Verify the public plugin in a fresh Codex session
        env:
          STUDIO_REPORT_FILE: output/verification/registry-plugin-session.json
        run: node -e 'process.env.STUDIO_EXPECTED_VERSION=require("./package.json").version;require("./scripts/verify-plugin-session.cjs")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geogebra-studio-public-${{ github.event.release.tag_name || inputs.release_tag }}
          path: |
            output/verification/registry-publication.json
            output/verification/registry-plugin-session.json
            output/verification/registry-studio/*
