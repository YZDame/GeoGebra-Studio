name: Pull request checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      math:
        description: Run optional real-GeoGebra mathematical regression checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
      - run: npm run test:unit
      - run: node scripts/package-release.cjs
      - run: node scripts/verify-package.cjs
      - if: github.event_name == 'workflow_dispatch' && inputs.math
        run: node dist/cli.js browser install
      - if: github.event_name == 'workflow_dispatch' && inputs.math
        run: npm run verify:math
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.math
        with:
          name: mathematical-regression-evidence
          path: output/verification/math/

  # Only trusted same-repository owner branches may commit the generated
  # standalone runtime. External PRs never receive a write-capable job.
  sync-skill-runtime:
    needs: acceptance
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Commit reproducible portable runtime to the Skill source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f skills/geogebra-studio/runtime/
          if ! git diff --cached --quiet; then
            git commit -m "build: sync portable Skill runtime [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  real-browser-regression:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Prepare Chrome and publish its executable path
        run: |
          node dist/cli.js browser install > browser.json
          echo "PUPPETEER_EXECUTABLE_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("browser.json","utf8")).executablePath')" >> "$GITHUB_ENV"
      - run: node scripts/verify-artifact.cjs
      - run: STUDIO_HTML_FIXTURE=output/verification/studio/tangent-construction.html node scripts/verify-viewer.cjs
      - run: node scripts/verify-viewer-3d.cjs
      - run: npm run verify:math
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-evidence
          path: output/verification/

  codex-plugin-smoke:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CODEX_HOME: /tmp/codex-geogebra-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm install --global @openai/codex@0.162.1
      - run: node dist/cli.js install --local
      - run: node scripts/verify-plugin-session.cjs
