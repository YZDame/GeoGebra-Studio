name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site
          mkdir -p _site/figures
          cp -a site/. _site/
          rm -rf _site/.taste-skill
          cp assets/geogebra-icon.png _site/
          cp examples/*.html _site/figures/
          if stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count) && [[ "$stars" =~ ^[0-9]+$ ]]; then
            sed -i -e 's/data-stars hidden/data-stars/' -e "s/data-star-count><\/span>/data-star-count>$stars<\/span>/" _site/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
