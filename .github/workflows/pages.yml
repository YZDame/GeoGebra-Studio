name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site/figures
          cp -a site/. _site/
          rm -rf _site/.taste-skill
          rm -f _site/figures/*.html
          cp examples/napoleon.html examples/nine-point-circle.html examples/hyperboloid-ruled.html examples/calabi-yau.html _site/figures/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
