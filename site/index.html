<body>
  <a class="skip-link" href="#top" data-en="Skip to content">跳到内容</a>

    <a class="brand" href="#top">GeoGebra Studio</a>
    <nav aria-label="网站导航" data-en-label="Site navigation">
      <a href="https://github.com/YZDame/GeoGebra-Studio/blob/main/README.zh-CN.md" data-en="Docs" data-en-href="https://github.com/YZDame/GeoGebra-Studio#readme">文档</a>

  </header>

  <main class="wrap" id="top">
    <section class="hero" id="install" aria-labelledby="hero-title">
      <h1 id="hero-title" data-en="Make interactive math figures">生成可拖动的数学图形</h1>
      <p class="lead" data-en="An Agent Skill for creating, editing and exporting GeoGebra figures.">用 Agent Skill 生成、编辑和导出 GeoGebra 图形。</p>
      <div class="command">
        <code id="cmd-install">npx skills add YZDame/GeoGebra-Studio --skill geogebra-studio</code>
        <button type="button" data-copy="cmd-install" data-en="Copy" hidden>复制</button>
      </div>
      <p class="requirements" data-en="Requires Node.js 22.12+ and a client that supports Agent Skills.">需要 Node.js 22.12+ 和支持 Agent Skills 的客户端。</p>
      <p class="sr-only" role="status" id="copy-status"></p>
    </section>

    <section class="examples" id="examples" aria-labelledby="examples-title">
      <h2 id="examples-title" data-en="Examples">示例</h2>
      <ul>
        <li id="figure">
          <a href="figures/napoleon.html">
            <span data-en="Napoleon’s theorem">拿破仑定理</span><span aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="figures/nine-point-circle.html">
            <span data-en="Nine-point circle">九点圆</span><span aria-hidden="true">→</span>
          </a>
        </li>
        <li id="hyper">
          <a href="figures/hyperboloid-ruled.html">
            <span data-en="Ruled hyperboloid">单叶双曲面</span><span aria-hidden="true">→</span>
          </a>
        </li>
        <li id="calabi">
          <a href="figures/calabi-yau.html">
            <span data-en="Fermat quintic projection">费马五次投影</span><span aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
